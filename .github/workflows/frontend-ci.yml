name: Frontend CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  frontend:
    name: Build & Typecheck (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - client_website
          - admin_app

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc -b

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

      # Certaines erreurs ESLint historiques sont en cours de correction par l'equipe :
      # on execute le lint pour visibilite sans bloquer la CI tant que le nettoyage n'est pas termine.
      - name: Lint (non bloquant pour l'instant)
        run: npm run lint
        continue-on-error: true
